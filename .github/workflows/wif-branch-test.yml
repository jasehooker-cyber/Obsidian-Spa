name: WIF Branch Test

on:
  push:
    branches:
      - feat/google-wif-auth

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -- src/lib/config/__tests__/google-env.test.ts
